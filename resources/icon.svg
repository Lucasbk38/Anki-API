<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3651C7"/>
      <stop offset="1" stop-color="#1E2F8A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- back card (peeking) -->
  <rect x="42" y="26" width="58" height="76" rx="9" fill="#1730A8" opacity="0.55" transform="rotate(9 71 64)"/>

  <!-- front card -->
  <rect x="30" y="24" width="58" height="76" rx="9" fill="#F5F7FF" transform="rotate(-6 59 62)"/>

  <!-- text lines on the front card -->
  <g transform="rotate(-6 59 62)">
    <rect x="40" y="40" width="34" height="7" rx="3.5" fill="#2A3B8F"/>
    <rect x="40" y="54" width="26" height="5" rx="2.5" fill="#9AA6D9"/>
    <rect x="40" y="65" width="30" height="5" rx="2.5" fill="#9AA6D9"/>
    <rect x="40" y="76" width="18" height="5" rx="2.5" fill="#9AA6D9"/>
  </g>

  <!-- sync badge -->
  <circle cx="94" cy="94" r="21" fill="#FF8A3D"/>
  <path d="M85 90 a10 10 0 1 1 -1 6" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M84 84 l1 8 l8 -2 z" fill="#FFFFFF"/>
</svg>
